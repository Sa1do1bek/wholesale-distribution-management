# Production docker-compose with multiple app instances for load balancing
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: wholesale-db
    environment:
      POSTGRES_DB: wholesale_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wholesale-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Spring Boot Application Instance 1
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wholesale-app-1
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/wholesale_db
      DATABASE_USERNAME: ${DB_USER:-postgres}
      DATABASE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - wholesale-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Spring Boot Application Instance 2
  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wholesale-app-2
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/wholesale_db
      DATABASE_USERNAME: ${DB_USER:-postgres}
      DATABASE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - wholesale-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # NGINX Load Balancer
  nginx:
    image: nginx:alpine
    container_name: wholesale-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - wholesale-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

networks:
  wholesale-network:
    driver: bridge

volumes:
  postgres_data:
