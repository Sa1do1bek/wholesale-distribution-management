spring:
  application:
    name: wholesale-distribution-management

  datasource:
    url: jdbc:postgresql://dpg-d8bsub4m0tmc73er2sgg-a.oregon-postgres.render.com:5432/wdm_ytpk
    username: user
    password: M1ZyrQuA5dxBosvtk3P44dTLc6wkJI6W
    driver-class-name: org.postgresql.Driver

    hikari:
      connection-timeout: 10000 # 10 seconds maximum wait time
      initialization-fail-timeout: 1 # Fail immediately on startup if DB is down
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong}
  expiration: ${JWT_EXPIRATION:86400000}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.wholesale: DEBUG
    org.springframework.security: INFO
