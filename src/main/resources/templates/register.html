<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Wholesale Distribution Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Join Wholesale Distribution Management</p>
            </div>
            
            <form id="registerForm" class="auth-form">
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                
                <div class="form-group">
                    <label for="username"><i class="fa-solid fa-user" style="color: var(--accent-primary); margin-right: 6px;"></i> Username</label>
                    <input type="text" id="username" name="username" required placeholder="Choose a username" minlength="3">
                </div>
                
                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope" style="color: var(--accent-primary); margin-right: 6px;"></i> Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="fullName"><i class="fa-solid fa-id-card" style="color: var(--accent-primary); margin-right: 6px;"></i> Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-key" style="color: var(--accent-primary); margin-right: 6px;"></i> Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password" minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword"><i class="fa-solid fa-lock" style="color: var(--accent-primary); margin-right: 6px;"></i> Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-user-plus"></i> Register</button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="/login">Login here</a></p>
            </div>
        </div>
    </div>
    
    <script th:src="@{/js/auth.js}"></script>
</body>
</html>
