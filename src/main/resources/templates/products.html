<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Wholesale Distribution Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-cloud-bolt"></i> <span>WDM System</span></h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/dashboard">
                        <i class="fa-solid fa-chart-pie"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/customers-page">
                        <i class="fa-solid fa-users"></i>
                        <span>Customers</span>
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="/products-page">
                        <i class="fa-solid fa-box-open"></i>
                        <span>Products</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/inventory-page">
                        <i class="fa-solid fa-warehouse"></i>
                        <span>Inventory</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/orders-page">
                        <i class="fa-solid fa-receipt"></i>
                        <span>Orders</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <div id="userInfo" class="user-info"></div>
                <button onclick="logout()" class="btn btn-danger btn-small btn-block"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></button>
            </div>
        </nav>
        
        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1><i class="fa-solid fa-box" style="color: var(--accent-indigo); margin-right: 8px;"></i> Product Management</h1>
                    <p>Manage inventory stock profiles, pricing, and sizing categories</p>
                </div>
                <div class="header-actions">
                    <div style="position: relative;">
                        <input type="text" id="searchInput" placeholder="Search products..." class="search-input" style="padding-left: 36px;">
                        <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 14px; top: 13px; color: var(--text-muted);"></i>
                    </div>
                    <select id="categoryFilter" class="filter-select">
                        <option value="">All Categories</option>
                    </select>
                    <button onclick="showAddModal()" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Product</button>
                </div>
            </header>
            
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>SKU</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Size</th>
                            <th>Color</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTable">
                    </tbody>
                </table>
            </div>
            
            <div class="pagination" id="pagination"></div>
        </main>
    </div>
    
    <!-- Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Product</h2>
                <button onclick="closeModal()" class="close-btn">&times;</button>
            </div>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name"><i class="fa-solid fa-tag" style="color: var(--accent-primary); margin-right: 6px;"></i> Product Name *</label>
                        <input type="text" id="name" required placeholder="Enter product name">
                    </div>
                    <div class="form-group">
                        <label for="sku"><i class="fa-solid fa-barcode" style="color: var(--accent-primary); margin-right: 6px;"></i> SKU *</label>
                        <input type="text" id="sku" required placeholder="Enter barcode SKU">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="category"><i class="fa-solid fa-folder" style="color: var(--accent-primary); margin-right: 6px;"></i> Category *</label>
                        <input type="text" id="category" required placeholder="e.g. Apparel, Hardware">
                    </div>
                    <div class="form-group">
                        <label for="price"><i class="fa-solid fa-money-bill-wave" style="color: var(--accent-primary); margin-right: 6px;"></i> Price *</label>
                        <input type="number" id="price" step="0.01" min="0" required placeholder="0.00">
                    </div>
                </div>
                <div class="form-group">
                    <label for="description"><i class="fa-solid fa-align-left" style="color: var(--accent-primary); margin-right: 6px;"></i> Description</label>
                    <textarea id="description" rows="2" placeholder="Enter product description..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="size"><i class="fa-solid fa-ruler" style="color: var(--accent-primary); margin-right: 6px;"></i> Size</label>
                        <input type="text" id="size" placeholder="e.g. Large, 32, 10oz">
                    </div>
                    <div class="form-group">
                        <label for="color"><i class="fa-solid fa-palette" style="color: var(--accent-primary); margin-right: 6px;"></i> Color</label>
                        <input type="text" id="color" placeholder="e.g. Blue, Matte Black">
                    </div>
                </div>
                <div class="form-group" id="stockGroup">
                    <label for="stockQuantity"><i class="fa-solid fa-cubes" style="color: var(--accent-primary); margin-right: 6px;"></i> Initial Stock Quantity</label>
                    <input type="number" id="stockQuantity" min="0" value="0">
                </div>
                <div class="form-actions">
                    <button type="button" onclick="closeModal()" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save</button>
                </div>
            </form>
        </div>
    </div>
    
    <script th:src="@{/js/app.js}"></script>
    <script>
        let currentPage = 0;
        const pageSize = 10;
        
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            loadProducts();
            loadCategories();
            
            document.getElementById('searchInput').addEventListener('input', debounce(searchProducts, 300));
            document.getElementById('categoryFilter').addEventListener('change', filterByCategory);
            document.getElementById('productForm').addEventListener('submit', saveProduct);
        });
        
        async function loadProducts(page = 0) {
            currentPage = page;
            try {
                const response = await apiRequest(`/products?page=${page}&size=${pageSize}`);
                const data = await response.json();
                renderProducts(data);
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }
        
        async function loadCategories() {
            try {
                const response = await apiRequest('/products/categories');
                const categories = await response.json();
                const select = document.getElementById('categoryFilter');
                categories.forEach(cat => {
                    select.innerHTML += `<option value="${cat}">${cat}</option>`;
                });
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }
        
        async function searchProducts() {
            const search = document.getElementById('searchInput').value;
            if (search.length < 2) {
                loadProducts();
                return;
            }
            try {
                const response = await apiRequest(`/products/search?q=${encodeURIComponent(search)}&page=0&size=${pageSize}`);
                const data = await response.json();
                renderProducts(data);
            } catch (error) {
                console.error('Error searching products:', error);
            }
        }
        
        async function filterByCategory() {
            const category = document.getElementById('categoryFilter').value;
            if (!category) {
                loadProducts();
                return;
            }
            try {
                const response = await apiRequest(`/products/category/${encodeURIComponent(category)}?page=0&size=${pageSize}`);
                const data = await response.json();
                renderProducts(data);
            } catch (error) {
                console.error('Error filtering products:', error);
            }
        }
        
        function renderProducts(data) {
            const tbody = document.getElementById('productsTable');
            tbody.innerHTML = data.content.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td><strong>${p.sku}</strong></td>
                    <td>${p.name}</td>
                    <td>${p.category}</td>
                    <td>${formatCurrency(p.price)}</td>
                    <td>${p.size || '-'}</td>
                    <td>${p.color || '-'}</td>
                    <td><strong>${p.stockQuantity !== null ? p.stockQuantity : '-'}</strong></td>
                    <td><span class="badge ${p.active ? 'badge-success' : 'badge-danger'}">${p.active ? 'Active' : 'Inactive'}</span></td>
                    <td>
                        <button onclick="editProduct(${p.id})" class="btn btn-small btn-secondary"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                        <button onclick="deleteProduct(${p.id})" class="btn btn-small btn-danger"><i class="fa-solid fa-trash-can"></i> Delete</button>
                    </td>
                </tr>
            `).join('');
            
            renderPagination(data, 'pagination', loadProducts);
        }
        
        function showAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Product';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('stockGroup').style.display = 'block';
            document.getElementById('productModal').style.display = 'flex';
        }
        
        async function editProduct(id) {
            try {
                const response = await apiRequest(`/products/${id}`);
                const product = await response.json();
                
                document.getElementById('modalTitle').textContent = 'Edit Product';
                document.getElementById('productId').value = product.id;
                document.getElementById('name').value = product.name;
                document.getElementById('sku').value = product.sku;
                document.getElementById('category').value = product.category;
                document.getElementById('price').value = product.price;
                document.getElementById('description').value = product.description || '';
                document.getElementById('size').value = product.size || '';
                document.getElementById('color').value = product.color || '';
                document.getElementById('stockGroup').style.display = 'none';
                
                document.getElementById('productModal').style.display = 'flex';
            } catch (error) {
                alert('Error loading product');
            }
        }
        
        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const data = {
                name: document.getElementById('name').value,
                sku: document.getElementById('sku').value,
                category: document.getElementById('category').value,
                price: parseFloat(document.getElementById('price').value),
                description: document.getElementById('description').value,
                size: document.getElementById('size').value,
                color: document.getElementById('color').value
            };
            
            if (!id) {
                data.stockQuantity = parseInt(document.getElementById('stockQuantity').value) || 0;
            }
            
            try {
                if (id) {
                    await apiRequest(`/products/${id}`, 'PUT', data);
                } else {
                    await apiRequest('/products', 'POST', data);
                }
                closeModal();
                loadProducts(currentPage);
            } catch (error) {
                alert('Error saving product');
            }
        }
        
        async function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                try {
                    await apiRequest(`/products/${id}`, 'DELETE');
                    loadProducts(currentPage);
                } catch (error) {
                    alert('Error deleting product');
                }
            }
        }
        
        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }
    </script>
</body>
</html>
