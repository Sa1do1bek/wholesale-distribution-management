<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Wholesale Distribution Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-cloud-bolt"></i> <span>WDM System</span></h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/dashboard">
                        <i class="fa-solid fa-chart-pie"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="/customers-page">
                        <i class="fa-solid fa-users"></i>
                        <span>Customers</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/products-page">
                        <i class="fa-solid fa-box-open"></i>
                        <span>Products</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/inventory-page">
                        <i class="fa-solid fa-warehouse"></i>
                        <span>Inventory</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/orders-page">
                        <i class="fa-solid fa-receipt"></i>
                        <span>Orders</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <div id="userInfo" class="user-info"></div>
                <button onclick="logout()" class="btn btn-danger btn-small btn-block"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></button>
            </div>
        </nav>
        
        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1><i class="fa-solid fa-users-gear" style="color: var(--accent-indigo); margin-right: 8px;"></i> Customer Management</h1>
                    <p>View, search, and manage corporate clients</p>
                </div>
                <div class="header-actions">
                    <div style="position: relative;">
                        <input type="text" id="searchInput" placeholder="Search customers..." class="search-input" style="padding-left: 36px;">
                        <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 14px; top: 13px; color: var(--text-muted);"></i>
                    </div>
                    <button onclick="showAddModal()" class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> Add Customer</button>
                </div>
            </header>
            
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Company</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>City</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="customersTable">
                    </tbody>
                </table>
            </div>
            
            <div class="pagination" id="pagination"></div>
        </main>
    </div>
    
    <!-- Modal -->
    <div id="customerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Customer</h2>
                <button onclick="closeModal()" class="close-btn">&times;</button>
            </div>
            <form id="customerForm">
                <input type="hidden" id="customerId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName"><i class="fa-solid fa-user" style="color: var(--accent-primary); margin-right: 6px;"></i> Full Name *</label>
                        <input type="text" id="fullName" required placeholder="Enter full name">
                    </div>
                    <div class="form-group">
                        <label for="companyName"><i class="fa-solid fa-building" style="color: var(--accent-primary); margin-right: 6px;"></i> Company Name</label>
                        <input type="text" id="companyName" placeholder="Enter company name">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email"><i class="fa-solid fa-envelope" style="color: var(--accent-primary); margin-right: 6px;"></i> Email</label>
                        <input type="email" id="email" placeholder="client@company.com">
                    </div>
                    <div class="form-group">
                        <label for="phone"><i class="fa-solid fa-phone" style="color: var(--accent-primary); margin-right: 6px;"></i> Phone</label>
                        <input type="text" id="phone" placeholder="+1 (555) 000-0000">
                    </div>
                </div>
                <div class="form-group">
                    <label for="address"><i class="fa-solid fa-location-dot" style="color: var(--accent-primary); margin-right: 6px;"></i> Address</label>
                    <textarea id="address" rows="2" placeholder="Enter shipping/billing address"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="city"><i class="fa-solid fa-city" style="color: var(--accent-primary); margin-right: 6px;"></i> City</label>
                        <input type="text" id="city" placeholder="Enter city">
                    </div>
                    <div class="form-group">
                        <label for="country"><i class="fa-solid fa-globe" style="color: var(--accent-primary); margin-right: 6px;"></i> Country</label>
                        <input type="text" id="country" placeholder="Enter country">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" onclick="closeModal()" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save</button>
                </div>
            </form>
        </div>
    </div>
    
    <script th:src="@{/js/app.js}"></script>
    <script>
        let currentPage = 0;
        const pageSize = 10;
        
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            loadCustomers();
            
            document.getElementById('searchInput').addEventListener('input', debounce(searchCustomers, 300));
            document.getElementById('customerForm').addEventListener('submit', saveCustomer);
        });
        
        async function loadCustomers(page = 0) {
            currentPage = page;
            try {
                const response = await apiRequest(`/customers?page=${page}&size=${pageSize}`);
                const data = await response.json();
                renderCustomers(data);
            } catch (error) {
                console.error('Error loading customers:', error);
            }
        }
        
        async function searchCustomers() {
            const search = document.getElementById('searchInput').value;
            if (search.length < 2) {
                loadCustomers();
                return;
            }
            try {
                const response = await apiRequest(`/customers/search?q=${encodeURIComponent(search)}&page=0&size=${pageSize}`);
                const data = await response.json();
                renderCustomers(data);
            } catch (error) {
                console.error('Error searching customers:', error);
            }
        }
        
        function renderCustomers(data) {
            const tbody = document.getElementById('customersTable');
            tbody.innerHTML = data.content.map(c => `
                <tr>
                    <td>${c.id}</td>
                    <td><strong>${c.fullName}</strong></td>
                    <td>${c.companyName || '-'}</td>
                    <td>${c.email || '-'}</td>
                    <td>${c.phone || '-'}</td>
                    <td>${c.city || '-'}</td>
                    <td><span class="badge ${c.active ? 'badge-success' : 'badge-danger'}">${c.active ? 'Active' : 'Inactive'}</span></td>
                    <td>
                        <button onclick="editCustomer(${c.id})" class="btn btn-small btn-secondary"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                        <button onclick="deleteCustomer(${c.id})" class="btn btn-small btn-danger"><i class="fa-solid fa-trash-can"></i> Delete</button>
                    </td>
                </tr>
            `).join('');
            
            renderPagination(data, 'pagination', loadCustomers);
        }
        
        function showAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Customer';
            document.getElementById('customerForm').reset();
            document.getElementById('customerId').value = '';
            document.getElementById('customerModal').style.display = 'flex';
        }
        
        async function editCustomer(id) {
            try {
                const response = await apiRequest(`/customers/${id}`);
                const customer = await response.json();
                
                document.getElementById('modalTitle').textContent = 'Edit Customer';
                document.getElementById('customerId').value = customer.id;
                document.getElementById('fullName').value = customer.fullName;
                document.getElementById('companyName').value = customer.companyName || '';
                document.getElementById('email').value = customer.email || '';
                document.getElementById('phone').value = customer.phone || '';
                document.getElementById('address').value = customer.address || '';
                document.getElementById('city').value = customer.city || '';
                document.getElementById('country').value = customer.country || '';
                
                document.getElementById('customerModal').style.display = 'flex';
            } catch (error) {
                alert('Error loading customer');
            }
        }
        
        async function saveCustomer(e) {
            e.preventDefault();
            const id = document.getElementById('customerId').value;
            const data = {
                fullName: document.getElementById('fullName').value,
                companyName: document.getElementById('companyName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                country: document.getElementById('country').value
            };
            
            try {
                if (id) {
                    await apiRequest(`/customers/${id}`, 'PUT', data);
                } else {
                    await apiRequest('/customers', 'POST', data);
                }
                closeModal();
                loadCustomers(currentPage);
            } catch (error) {
                alert('Error saving customer');
            }
        }
        
        async function deleteCustomer(id) {
            if (confirm('Are you sure you want to delete this customer?')) {
                try {
                    await apiRequest(`/customers/${id}`, 'DELETE');
                    loadCustomers(currentPage);
                } catch (error) {
                    alert('Error deleting customer');
                }
            }
        }
        
        function closeModal() {
            document.getElementById('customerModal').style.display = 'none';
        }
    </script>
</body>
</html>
